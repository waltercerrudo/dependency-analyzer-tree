
name: Build VS Extension

'on':
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ReferenceConflictAnalyser.sln

    - name: Build solution
      run: msbuild ReferenceConflictAnalyser.sln /p:Configuration=Release /p:DeployExtension=false

    - name: Find VSIX file
      run: |
        Get-ChildItem -Recurse -Filter *.vsix | ForEach-Object { Write-Host $_.FullName }
      shell: pwsh

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: dependency-analyzer-vsix
        path: '**/*.vsix'
